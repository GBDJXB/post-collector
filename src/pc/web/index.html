<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>post-collector</title><link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js" defer></script></head>
<body>
<h1>post-collector</h1>
<p id="session-status">正在检查本机会话……</p>
<p id="notice" role="status" aria-live="polite"></p>
<main id="workspace" hidden>
<button id="logout" type="button">退出本机会话</button>
<section><h2>检索与最近消息</h2>
<form id="search-form">
<label>关键词 <input name="q" maxlength="4096"></label>
<label>来源名或 ID <input name="source"></label>
<label>标签（每行一个，全部匹配）<textarea name="tags" rows="2"></textarea></label>
<fieldset><legend>内容类型（不勾选表示全部）</legend>
<label><input type="checkbox" name="item_types" value="text">文本</label>
<label><input type="checkbox" name="item_types" value="image">图片</label>
<label><input type="checkbox" name="item_types" value="mixed">混合</label>
<label><input type="checkbox" name="item_types" value="video">视频</label>
<label><input type="checkbox" name="item_types" value="audio">音频</label>
<label><input type="checkbox" name="item_types" value="link">链接</label>
<label><input type="checkbox" name="item_types" value="sticker">贴纸</label>
<label><input type="checkbox" name="item_types" value="file">文件</label></fieldset>
<label>开始日期 <input name="since" type="date"></label>
<label>结束日期 <input name="until" type="date"></label>
<label>时间字段 <select name="time_field"><option value="ingest">入库时间</option><option value="sent">发送时间</option></select></label>
<label>排序 <select name="sort"><option value="time">时间</option><option value="relevance">相关度</option></select></label>
<label>每页 <input name="limit" type="number" min="1" max="50" value="40"></label>
<label><input name="include_duplicates" type="checkbox">包括重复消息</label>
<button type="submit">检索 / 返回第一页</button></form>
<p id="search-summary"></p>
<div class="table-wrap"><table><thead><tr><th>选择</th><th>消息 ID</th><th>类型</th><th>内容</th><th>标签</th><th>来源</th><th>时间</th><th>详情</th></tr></thead><tbody id="hits"></tbody></table></div>
<button id="next" type="button" disabled>下一页</button></section>

<section><h2>详情与本机操作</h2>
<form id="detail-form"><label>目标 <select id="detail-kind"><option value="message_id">消息 ID</option><option value="content_id">内容项 ID</option></select></label>
<label>ID <input id="detail-id" type="number" min="1" required></label><button type="submit">查看</button></form>
<p id="detail-summary"></p><div id="parts"></div>
<label>系统操作目标 <select id="action-target"><option value="current">当前查看目标</option><option value="parts">详情中勾选的一个内容项</option></select></label>
<label><input id="copy-also" type="checkbox">打开 / 定位时同时复制</label>
<button type="button" data-action="open">默认程序打开</button>
<button type="button" data-action="reveal">文件管理器定位</button>
<button type="button" data-action="copy">复制</button>
<p>文本复制正文；图片复制文件。混合内容打开为 HTML，暂不支持复制。</p></section>

<section><h2>人工标签与关联</h2>
<label>标签操作目标 <select id="tag-target"><option value="messages">结果中勾选的消息</option><option value="parts">详情中勾选的内容项</option></select></label>
<label>标签名称（每行一个）<textarea id="tag-names" rows="3"></textarea></label>
<label>命名空间 <input id="namespace" value="general"></label>
<button type="button" id="tag-add">添加标签</button><button type="button" id="tag-remove">撤销标签</button>
<button type="button" id="assignments-load">查看目标关联记录</button>
<div class="table-wrap"><table><thead><tr><th>建议选择</th><th>关联 ID</th><th>内容 ID</th><th>名称</th><th>来源</th><th>置信度</th><th>撤销时间</th></tr></thead><tbody id="assignments"></tbody></table></div>
<button type="button" id="confirm">确认勾选建议</button><button type="button" id="reject">拒绝勾选建议</button></section>

<section><h2>标签目录与别名</h2><button type="button" id="tags-load">刷新标签目录</button>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>名称</th><th>命名空间</th><th>状态</th><th>使用量</th><th>别名</th></tr></thead><tbody id="tags"></tbody></table></div>
<label>规范标签名 <input id="alias-name"></label><label>别名 <input id="alias-value"></label>
<button type="button" id="aliases-load">查询别名</button><button type="button" id="alias-add">添加别名</button><button type="button" id="alias-remove">移除别名</button>
<div class="table-wrap"><table><thead><tr><th>别名</th><th>规范标签名</th><th>命名空间</th></tr></thead><tbody id="aliases"></tbody></table></div></section>
</main></body></html>
