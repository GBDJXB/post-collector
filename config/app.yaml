# ---------------------------------------------------------------------------
# config/app.yaml —— L2 开发配置（带注释，进 git，由开发者直接编辑）
#
# 配置分层（DESIGN §6.2）：
#   L1 设置页   → SQLite setting 表（面向所有 root，热更新）
#   L2 本文件   → 开发者直接改，校验通过后热重载
#   L3 .env     → 部署参数（数据存放位置、行为开关），需重启进程
#
# 单一来源原则：本文件的 defaults 段只在「首次启动」时用于播种 setting 表，
# 之后以数据库为准。凡是被设置页接管的键，界面会显示「此项由设置页管理」。
# 因此：修改 defaults 段不会影响已初始化的实例，改 UI 更直接。
#
# 校验：启动时按 config/settings-registry.yaml 校验；报错需精确到行号。
# 覆盖：任意键都可用环境变量覆盖，形式为 PC__A__B（见 .env.example）。
# ---------------------------------------------------------------------------

schema_version: 1

# ---------------------------------------------------------------------------
# defaults —— 首次启动播种 setting 表的默认值
#
# 约束：
#   * 本节每一个键都必须存在于 config/settings-registry.yaml —— 出现未知键会**直接报错**
#     （拼错的键会被静默忽略，那正是「改了文件没生效」最常见的来源）。
#   * 本节的默认值允许与注册表不同：它就是解析链里的 yaml 层（env > db > yaml > default）。
#     两者不一致时 `pc config show` 会提示一句，并说明已播种的实例以数据库为准。
# ---------------------------------------------------------------------------
defaults:

  # 相似图片判定严格度（汉明距离，越小越严格）—— DESIGN §3.6
  dedup.near_duplicate_distance: 6

  # AI 参与度：off | local_only | assist | advisory_auto —— DESIGN §4.7.3
  # 骨架与 MVP 阶段建议先用 off（纯手动）跑通全流程，再切 local_only。
  ai.involvement: local_only

  # 内容库最大占用（字节），默认 200 GB —— DESIGN §7.5
  retention.max_total_bytes: 214748364800

  # 检索默认每页条数 —— DESIGN §6.2.1
  search.default_page_size: 40

  # 匿名提报入口开关，默认关闭 —— DESIGN §6.1
  inbox.enabled: false

  # 全局「仅本地」开关，默认开启 —— DESIGN §6.3
  privacy.local_only_mode: true

# ---------------------------------------------------------------------------
# db —— 刻意只留在 L2/L3，不进设置页（改错无法用一句大白话说明后果）
#
# 数据库就是一个文件：<data_root>/pc.sqlite3。两项都留空 = 用平台默认的用户数据
# 目录（DESIGN §10.2）；部署层可用 PC_DATA_ROOT / PC__DB__PATH 覆盖这里。
# PRAGMA 基线（WAL、foreign_keys、busy_timeout、synchronous）不在这里配置：
# 它们是设计不变量，由适配器在建立连接时统一执行（见 DESIGN §3.2）。
# ---------------------------------------------------------------------------
db:
  path: ""          # 直接指定数据库文件；留空则用 <data_root>/pc.sqlite3
  data_root: ""     # 数据根目录；留空则用平台默认（%LOCALAPPDATA% / XDG / Application Support）

# ---------------------------------------------------------------------------
# paths —— 留空 = 从数据根目录派生（DESIGN §10.2）。多盘存储可显式指定。
# ---------------------------------------------------------------------------
paths:
  media_root: ""      # 留空 = <data_root>/media  内容寻址媒体本体 ab/cd/<sha256>
  thumb_root: ""      # 留空 = <data_root>/thumbs 派生缩略图，建议留在 SSD（检索热路径）
  cold_root: ""       # 留空 = <data_root>/cold   冷层，可指向 NAS 挂载
  quarantine_root: "" # 留空 = <data_root>/quarantine  L2 提报隔离区，必须与 media 物理分离
  backup_root: ""     # 留空 = <data_root>/backup；默认不保证异盘，备份目标须另设物理介质
  models_root: ""     # 留空 = <data_root>/models 本地模型权重（阶段 2 起使用）

# ---------------------------------------------------------------------------
# jobs —— 队列并发与批大小，刻意不暴露到设置页（DESIGN §6.2 末段）
# ---------------------------------------------------------------------------
jobs:
  worker_concurrency: 2
  batch_size: 20
  max_attempts_default: 5
  # 指数退避 + 抖动（秒）—— DESIGN §2.3
  backoff_seconds: [30, 120, 480, 1800, 7200]

# ---------------------------------------------------------------------------
# ingest —— 摄入层限额；媒体与文本的硬上限属于安全基线（DESIGN §6.5）
# ---------------------------------------------------------------------------
ingest:
  max_media_bytes: 52428800       # 单文件 50 MB
  max_image_pixels: 100000000     # 1 亿像素，解码隔离的上限
  max_text_chars: 100000
  link_autofetch: false           # 链接默认只记录不抓取 —— DESIGN §4.3

# ---------------------------------------------------------------------------
# security —— 安全网关基线；URL 策略网段清单刻意不进设置页（DESIGN §6.4）
# ---------------------------------------------------------------------------
security:
  sniff_mime_by_magic: true
  fail_closed_on_scan_error: true
  exif_strip_gps: true
  exif_strip_serial: true
  exif_strip_author: true
  allow_svg: false                # SVG 视为不可信 XML，默认拒绝
  allow_pdf_inline_render: false

# ---------------------------------------------------------------------------
# models —— 模型注册表入口（阶段 2 起填充；键位先占）
# 本阶段不加载任何模型：即使 ai.involvement=local_only，模型档位尚未接线。
# ---------------------------------------------------------------------------
models:
  profile: balanced               # 省资源 | balanced | 高质量 → 具体模型映射在阶段 2 维护
  registry_path: "/app/config/models.yaml"

# ---------------------------------------------------------------------------
# 说明：本文件「不包含」任何外发（egress）配置段。
# 唯一 AI 外发为本机 Web 明确放行的固定 DeepSeek 标签建议；密钥只在进程内。
# models 段仍无运行时消费方，不控制该 API 的模型名或 endpoint。见 DESIGN §6.3。
# ---------------------------------------------------------------------------
